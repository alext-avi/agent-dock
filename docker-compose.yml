services:
  control-plane:
    image: agent-dock-control-plane:${AGENT_DOCK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      WORKER_URL: http://worker:7777
      WORKER_TOKEN: ${WORKER_TOKEN:-local-dev-change-me}
      CLAUDE_WORKER_URL: http://claude-worker:7777
      CLAUDE_WORKER_TOKEN: ${WORKER_TOKEN:-local-dev-change-me}
      OPENCODE_WORKER_URL: http://opencode-worker:7777
      OPENCODE_WORKER_TOKEN: ${WORKER_TOKEN:-local-dev-change-me}
      CONTROL_PLANE_DATA_PATH: /control-data/agents.json
      SCHEDULER_DB_PATH: /control-data/scheduler.sqlite
      AUTH_DB_PATH: /control-data/auth.sqlite
      AUTH_MODE: ${AUTH_MODE:-trusted-local}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-http://127.0.0.1:3000}
      AUTH_PROVIDER_NAME: ${AUTH_PROVIDER_NAME:-GitHub}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      AUTH_API_AUDIENCE: ${AUTH_API_AUDIENCE:-http://127.0.0.1:3000/api}
      AUTH_MCP_AUDIENCE: ${AUTH_MCP_AUDIENCE:-http://127.0.0.1:3000/mcp}
      AUTH_LOCAL_MCP_TOKEN: ${AUTH_LOCAL_MCP_TOKEN:-}
      AUTH_OIDC_RESOURCE: ${AUTH_OIDC_RESOURCE:-}
      AUTH_OIDC_SCOPES: ${AUTH_OIDC_SCOPES:-openid,profile,email}
      AUTH_DEFAULT_ROLE: ${AUTH_DEFAULT_ROLE:-viewer}
      AUTH_ADMIN_SUBJECTS: ${AUTH_ADMIN_SUBJECTS:-}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
      AUTH_OPERATOR_SUBJECTS: ${AUTH_OPERATOR_SUBJECTS:-}
      AUTH_OPERATOR_EMAILS: ${AUTH_OPERATOR_EMAILS:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-1}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-1000}
      DELEGATION_DB_PATH: /control-data/delegations.sqlite
      MCP_TASK_TIMEOUT_MS: ${MCP_TASK_TIMEOUT_MS:-3600000}
      MCP_MAX_DELEGATION_DEPTH: ${MCP_MAX_DELEGATION_DEPTH:-4}
      MCP_MAX_CONCURRENT_PER_CALLER: ${MCP_MAX_CONCURRENT_PER_CALLER:-4}
      MCP_AGENT_POLICIES_JSON: ${MCP_AGENT_POLICIES_JSON:-{}}
      MCP_ALLOWED_HOSTNAMES: ${MCP_ALLOWED_HOSTNAMES:-}
      RUNTIME_PROVISIONER: docker
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      CODEX_WORKER_IMAGE: agent-dock-worker-codex:${AGENT_DOCK_IMAGE_TAG:-local}
      CLAUDE_WORKER_IMAGE: agent-dock-worker-claude:${AGENT_DOCK_IMAGE_TAG:-local}
      OPENCODE_WORKER_IMAGE: agent-dock-worker-opencode:${AGENT_DOCK_IMAGE_TAG:-local}
      CODEX_VERSION: ${CODEX_VERSION:-latest}
      CLAUDE_VERSION: ${CLAUDE_VERSION:-latest}
      OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
      ALLOW_UNSANDBOXED: ${ALLOW_UNSANDBOXED:-1}
      MCP_ALLOWED_COMMANDS: ${MCP_ALLOWED_COMMANDS:-}
      USAGE_POLL_INTERVAL_MS: ${USAGE_POLL_INTERVAL_MS:-60000}
      CLAUDE_OAUTH_USAGE: ${CLAUDE_OAUTH_USAGE:-0}
      CLAUDE_OAUTH_USAGE_INTERVAL_MS: ${CLAUDE_OAUTH_USAGE_INTERVAL_MS:-1800000}
    ports:
      - "${CONTROL_PLANE_BIND:-127.0.0.1}:${CONTROL_PLANE_PORT:-3000}:3000"
    volumes:
      - control-data:/control-data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      worker:
        condition: service_healthy
      claude-worker:
        condition: service_healthy
      opencode-worker:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: agent-dock-worker-codex:${AGENT_DOCK_IMAGE_TAG:-local}
    build:
      context: ./worker
    environment:
      PORT: "7777"
      WORKER_TOKEN: ${WORKER_TOKEN:-local-dev-change-me}
      WORKER_AUTH_MODE: ${WORKER_AUTH_MODE:-hybrid}
      CODEX_HOME: /codex-home
      CODEX_VERSION: ${CODEX_VERSION:-latest}
      ALLOW_UNSANDBOXED: ${ALLOW_UNSANDBOXED:-1}
      MCP_ALLOWED_COMMANDS: ${MCP_ALLOWED_COMMANDS:-}
      AGENT_DATA_PATH: /agent-data/usage.json
      USAGE_POLL_INTERVAL_MS: ${USAGE_POLL_INTERVAL_MS:-60000}
    volumes:
      - codex-auth:/codex-home
      - codex-bin:/opt/codex
      - agent-data:/agent-data
      - ./workspace:/workspace
    expose:
      - "7777"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7777/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 5s
    init: true
    restart: unless-stopped

  claude-worker:
    image: agent-dock-worker-claude:${AGENT_DOCK_IMAGE_TAG:-local}
    build:
      context: ./worker
      dockerfile: Dockerfile.claude
    environment:
      PORT: "7777"
      WORKER_TOKEN: ${WORKER_TOKEN:-local-dev-change-me}
      WORKER_AUTH_MODE: ${WORKER_AUTH_MODE:-hybrid}
      AGENT_ID: claude-worker-01
      AGENT_ADAPTER: claude-code
      HOME: /claude-home
      CLAUDE_HOME: /claude-home
      CLAUDE_CONFIG_DIR: /claude-home/.claude
      CLAUDE_VERSION: ${CLAUDE_VERSION:-latest}
      ALLOW_UNSANDBOXED: ${ALLOW_UNSANDBOXED:-1}
      MCP_ALLOWED_COMMANDS: ${MCP_ALLOWED_COMMANDS:-}
      AGENT_DATA_PATH: /agent-data/usage.json
      USAGE_POLL_INTERVAL_MS: ${USAGE_POLL_INTERVAL_MS:-60000}
      CLAUDE_OAUTH_USAGE: ${CLAUDE_OAUTH_USAGE:-0}
      CLAUDE_OAUTH_USAGE_INTERVAL_MS: ${CLAUDE_OAUTH_USAGE_INTERVAL_MS:-1800000}
      DISABLE_AUTOUPDATER: "1"
      BROWSER: echo
    volumes:
      - claude-auth:/claude-home
      - claude-bin:/opt/claude
      - claude-agent-data:/agent-data
      - ./claude-workspace:/workspace
    expose:
      - "7777"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7777/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 5s
    init: true
    restart: unless-stopped

  opencode-worker:
    image: agent-dock-worker-opencode:${AGENT_DOCK_IMAGE_TAG:-local}
    build:
      context: ./worker
      dockerfile: Dockerfile.opencode
    environment:
      PORT: "7777"
      WORKER_TOKEN: ${WORKER_TOKEN:-local-dev-change-me}
      WORKER_AUTH_MODE: ${WORKER_AUTH_MODE:-hybrid}
      AGENT_ID: opencode-worker-01
      AGENT_ADAPTER: opencode
      HOME: /opencode-home
      XDG_DATA_HOME: /opencode-home/.local/share
      XDG_CONFIG_HOME: /opencode-home/.config
      OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
      OPENCODE_AUTH_PROVIDER: ${OPENCODE_AUTH_PROVIDER:-github-copilot}
      OPENCODE_CONFIG: /agent-data/opencode-provider.json
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CONNECTION_ID: ${OLLAMA_CONNECTION_ID:-ollama-local}
      OLLAMA_DISPLAY_NAME: ${OLLAMA_DISPLAY_NAME:-Local Ollama}
      ALLOW_UNSANDBOXED: ${ALLOW_UNSANDBOXED:-1}
      MCP_ALLOWED_COMMANDS: ${MCP_ALLOWED_COMMANDS:-}
      AGENT_DATA_PATH: /agent-data/usage.json
    volumes:
      - opencode-auth:/opencode-home
      - opencode-bin:/opt/opencode
      - opencode-agent-data:/agent-data
      - ./opencode-workspace:/workspace
    expose:
      - "7777"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7777/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 5s
    init: true
    restart: unless-stopped

volumes:
  codex-auth:
  codex-bin:
  agent-data:
  claude-auth:
  claude-bin:
  claude-agent-data:
  opencode-auth:
  opencode-bin:
  opencode-agent-data:
  control-data:
